name: Feature request
description: Suggest a new feature or an improvement to pfwd.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search [existing issues](https://github.com/hoanghero125/pfwd/issues?q=is%3Aissue) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like pfwd to behave. Commands, key bindings or config snippets help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds or designs you have tried or thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of pfwd does this touch?
      multiple: true
      options:
        - TUI
        - SSH / forwarding
        - Port detection
        - CLI / config
        - Web UI
        - Packaging / install
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
