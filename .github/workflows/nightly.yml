name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC; avoids the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Available module updates
        run: |
          {
            echo '### Available Go module updates'
            echo '```'
            go list -m -u -f '{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all | sed '/^$/d'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # M3 adds the soak test job.
