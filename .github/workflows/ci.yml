name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    env:
      CGO_ENABLED: "1" # -race needs cgo; windows-latest ships mingw-w64 gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Ban ssh.InsecureIgnoreHostKey
        shell: bash
        run: |
          if git grep -n -I -F 'InsecureIgnoreHostKey' -- '*.go' ':(exclude)docs/**'; then
            echo "::error::ssh.InsecureIgnoreHostKey is banned: host keys must always be verified"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (includes staticcheck)
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          # --snapshot skips publishing but not signing; keyless cosign only runs in release.yml.
          args: release --snapshot --clean --skip=sign
