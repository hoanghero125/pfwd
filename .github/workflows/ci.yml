name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # keep every run on main

jobs:
  check:
    name: check (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    env:
      CGO_ENABLED: "1" # -race needs cgo; windows-latest ships mingw-w64 gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Ban ssh.InsecureIgnoreHostKey
        shell: bash
        run: |
          set +e # git grep exits 1 for "no match"; anything above 1 is an error
          git grep -n -I -F 'InsecureIgnoreHostKey' -- '*.go' ':(exclude)docs/**'
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::ssh.InsecureIgnoreHostKey is banned: host keys must always be verified"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep failed (exit $status), so the ban could not be checked"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (includes staticcheck)
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright, for the web UI's browser test
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests against sshd containers
        run: make e2e
        env:
          PFWD_E2E_BROWSER: "1"

  web:
    name: web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: svelte-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: web/dist matches the source
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::web/dist is out of date: run make web and commit web/dist"
            exit 1
          fi
      - name: Size budget (150 KB gzipped)
        run: npm run size
      - name: Browser tests against a mocked daemon (axe, screenshots, first paint)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=mock
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screens
          path: |
            web/test-results/screens
            web/playwright-report
          retention-days: 14

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3 # pinned like the Makefile's tools; bump by hand
          args: check
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          # --snapshot skips publishing but not signing; keyless cosign only runs in release.yml.
          args: release --snapshot --clean --skip=sign
