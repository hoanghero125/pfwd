version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    commit-message:
      prefix: build # "build(deps): bump ..." (Conventional Commits)
      include: scope
    cooldown:
      default-days: 3
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci # "ci(deps): bump ..."
      include: scope
    cooldown:
      default-days: 7
